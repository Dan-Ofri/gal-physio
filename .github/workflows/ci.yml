name: CI

on:
  # Every branch, not just main. Merges here go straight to main, which
  # auto-deploys, so a main-only trigger reported on work that was already
  # live. Running on the feature branch puts the signal before the merge.
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, not two. Splitting lint/build from e2e bought nothing: the second
  # job had to redo checkout, setup-node and `npm ci` (~33s) and could not start
  # until the first finished, and `npm test` then built the site a second time.
  verify:
    name: Lint, build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

      # Cache the browser binaries, keyed on the Playwright version that
      # actually resolved — they are tied to it, so a bump must miss the cache.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Every browser the config declares a project for. Chromium and WebKit
      # alone left the four Desktop Firefox header tests failing on every run
      # since c90c09d, with the rest of the suite green underneath.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # The cache holds the browsers, not the apt packages they link against.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run Playwright tests
        run: npm test
        env:
          CI: true
          PW_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

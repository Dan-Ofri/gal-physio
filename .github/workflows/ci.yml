name: CI

on:
  # Every branch, not just main. Merges here go straight to main with no PR, so
  # a main-only trigger reported after the fact, once the work had already
  # landed. Running on the feature branch puts the signal before the merge.
  # (Production no longer deploys on that push either — see the deploy job.)
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, not two. Splitting lint/build from e2e bought nothing: the second
  # job had to redo checkout, setup-node and `npm ci` (~33s) and could not start
  # until the first finished, and `npm test` then built the site a second time.
  verify:
    name: Lint, build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

      # Cache the browser binaries, keyed on the Playwright version that
      # actually resolved — they are tied to it, so a bump must miss the cache.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Every browser the config declares a project for. Chromium and WebKit
      # alone left the four Desktop Firefox header tests failing on every run
      # since c90c09d, with the rest of the suite green underneath.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # The cache holds the browsers, not the apt packages they link against.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run Playwright tests
        run: npm test
        env:
          CI: true
          PW_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Production deploys are gated on the suite above, not on the push.
  # `git.deploymentEnabled.main: false` in vercel.json stops Vercel deploying
  # main on its own, and this job fires the deploy hook once `verify` is green
  # (`needs:` will not run a job whose dependency failed). Preview deployments
  # for feature branches are untouched: only main is disabled.
  #
  # The alternative, Vercel's Ignored Build Step, does not work here. It runs at
  # push time, when this workflow has only just been queued, so it would have to
  # poll for a result from inside a Vercel build — and a build it skips is
  # canceled outright, with nothing to start it again once CI turns green.
  deploy:
    name: Deploy to production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not set. main no longer deploys on push, so nothing would ship. Create a deploy hook for main in the Vercel project's Git settings and add it as a repository secret."
            exit 1
          fi
          # The hook deploys the current tip of main, which is this commit
          # unless something else landed in the last couple of minutes.
          status=$(curl -sS -X POST -o hook-response.json -w '%{http_code}' "$HOOK_URL")
          cat hook-response.json
          echo
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Deploy hook returned HTTP $status"
            exit 1
          fi
